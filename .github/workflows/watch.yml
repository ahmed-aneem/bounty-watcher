name: Watch Algora bounties

on:
  schedule:
    - cron: "*/15 * * * *"   # every 15 minutes (GitHub may delay runs a few minutes at busy times)
  workflow_dispatch:          # lets you run it by hand from the Actions tab

permissions:
  issues: write
  contents: read

concurrency:
  group: bounty-watcher
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: node src/run.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TECH: ${{ vars.TECH || 'typescript,javascript' }}
          MIN_USD: ${{ vars.MIN_USD || '50' }}
          MAX_PER_REPO: ${{ vars.MAX_PER_REPO || '15' }}
          BLOCK_REPOS: ${{ vars.BLOCK_REPOS || 'UnsafeLabs/Bounty-Hunters,SecureBananaLabs/bug-bounty' }}
